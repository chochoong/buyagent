# ============================================================
#  상품명 차단 키워드 (허용 안 된 카테고리만 차단 효과가 있음)
#  오탐이 나도 '안 파는 쪽'으로 틀리는 게 안전합니다.
#  except: 이 단어들은 먼저 지우고 검사 → 정상 상품이 잘못 걸리는 것 방지
#          예) 'クリップ'(클립)이 'リップ'(립스틱)에 걸리지 않게
# ============================================================
[[block_rules]]
category = "plush"
keywords = ["ぬいぐるみ", "マスコット", "ぬいば", "パペット", "クッション", "plush"]

[[block_rules]]
category = "kids"
keywords = ["ベビー用", "子供用", "キッズ", "おもちゃ", "玩具", "よだれかけ", "スタイ", "哺乳"]
except = ["スタイル", "スタイリッシュ", "スタイリング", "スタイリスト"]

[[block_rules]]
category = "food"
keywords = ["お菓子", "クッキー", "チョコ", "グミ", "ラムネ", "せんべい", "バウム", "食品",
            "飲料", "ふりかけ", "カレー", "茶葉", "コーヒー豆"]
except = ["チョコレートブラウン", "チョコブラウン", "チョコレート色", "チョコ色"]

[[block_rules]]
category = "supplement"
keywords = ["サプリ", "医薬品", "第2類", "第3類", "ビタミン", "プロテイン"]
except = ["ビタミンカラー"]

[[block_rules]]
category = "cosmetics"
keywords = ["キャンメイク", "化粧", "ファンデーション", "日焼け止め", "美容液", "パウダー", "コスメ",
            "リップ", "シャンプー"]
except = ["化粧箱", "化粧ケース", "クリップ", "スリップ", "フィリップ", "トリップ", "リップル",
          "パウダーブルー", "パウダーピンク"]

[[block_rules]]
category = "electronics"
keywords = ["充電", "Bluetooth", "ワイヤレス", "電動", "家電", "イヤホン", "モバイルバッテリー"]

[[block_rules]]
category = "limited"
keywords = ["ハッピーセット", "一番くじ", "非売品", "ノベルティ", "特典", "当選"]
# 2026-11-18: '抽選'은 뺌 → 라쿠텐 가게 이벤트 문구("抽選100%還元", "抽選で最大…pt")에 걸려 '세이코' 88건 중 49건이 정상 시계인데 차단됨.
#   경품 자체는 一番くじ·当選·非売品으로 잡힘
# 상품에 '덤이 붙어 있다'는 말은 차단하지 않음. 특전·노벨티만 따로 파는 것('特典のみ', '特典 ブロマイド' 등)은 그대로 차단
except = ["購入特典", "特典付", "ノベルティ付", "ノベルティー付", "選べるノベルティ"]

[[block_rules]]
category = "weapon"
keywords = ["包丁", "ナイフ", "刀", "エアガン"]
except = ["刀剣乱舞", "刀剣男士"]

# 카테고리와 무관하게 항상 제외 (중고·부품·비정품 의심)
[categories._exclude]
name = "중고·비정품 의심"
allowed = false

[[block_rules]]
category = "_exclude"
keywords = ["中古", "ジャンク", "バラ売り", "海外版", "ノーブランド", "互換", "交換用",
            "替えベルト", "部品", "パーツ"]

# ============================================================
#  경고 키워드: 차단은 안 하고 알림만 (확인 필요 사항)
# ============================================================
[[warn_rules]]
keywords = ["電池", "battery", "バッテリー", "电池", "锂", "充电"]
message = "배터리 포함 → 항공 운송 가능 여부를 배대지에 확인"

[[warn_rules]]
keywords = ["无线", "蓝牙", "2.4G", "Bluetooth", "ワイヤレス", "wireless", "무선", "블루투스"]
message = "무선 제품 → 전파법 적합인증 대상. 구매대행은 구매자 1인 1대(개인 사용)만 가능, 사입 불가"

[[warn_rules]]
keywords = ["camera", "Camera", "カメラ", "摄像", "拍照"]
message = "카메라 탑재 → 몰래카메라·시험 부정행위를 연상시키는 문구 금지, 촬영음·촬영 표시등 여부 확인 (마켓 판매 제한 가능)"

[[warn_rules]]
keywords = ["RGB", "LED", "灯", "发光"]
message = "LED·전자부품 포함 의심 → 전자회로가 있으면 KC 대상인지 확인"

[[warn_rules]]
keywords = ["タンブラー", "tumbler", "食器", "マグカップ", "水筒", "弁当箱"]
message = "식품 접촉 용기 → 식약처 수입신고 대상인지 관세사 확인"

[[warn_rules]]
keywords = ["限定", "数量限定", "受注生産", "予約"]
message = "한정·예약 상품 → 발송 시기와 주문 취소 가능성 고지"
