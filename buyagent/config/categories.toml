# ============================================================
#  카테고리 규칙
#   allowed          : false면 이 카테고리는 계산도 등록도 안 함 (코드로 차단)
#   duty_rate        : 관세율 (HS코드마다 다를 수 있으니 관세사 확인 권장)
#   shipping_profile : settings.toml 배대지 요금표의 small / medium / large
#   bundle_size      : 기본 묶음 배송 수량 (기본 1)
#   min_margin_*     : 이 카테고리 전용 마진 기준
#   notice           : 상세페이지 고지문
#   check_shop       : true면 '정품 판매처 확인' 알림 (기본 true)
#
#  새 품목을 다루려면 [categories.<키>] 를 하나 추가하면 됩니다.
# ============================================================

# ---------------- 판매 가능 ----------------
