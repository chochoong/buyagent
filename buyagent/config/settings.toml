# ============================================================
#  구매대행 모니터 v3 - 기본 설정
#  카테고리 규칙은 categories.toml, 상품 목록은 catalog/*.csv 에 있습니다.
#
#  ★ API 키와 웹훅 주소는 여기 말고 settings.local.toml 에 넣으세요 (git에 안 올라감).
#    settings.local.toml.example 을 복사해서 만들면 됩니다.
# ============================================================

# ------------------------------------------------------------
#  소스(쇼핑몰) - 섹션 이름 = sources/ 폴더의 플러그인 이름
#  새 쇼핑몰: sources/_template.py 복사 → 여기 섹션 추가
# ------------------------------------------------------------
[sources.rakuten]
enabled = true
application_id = ""          # → settings.local.toml 에 입력
access_key = ""              # → settings.local.toml 에 입력 (없으면 비워 둠)
endpoint = "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20220601"
hits = 30
default_shipping = 800       # 배송비 별도 상품의 가정 배송비 (엔)
min_interval = 1.1           # 호출 간격(초). 라쿠텐은 초당 1회 제한
retries = 2                  # 429·5xx·네트워크 오류 시 재시도 횟수

[sources.rakuten_web]         # API 키 없이 라쿠텐 검색 페이지를 읽음 (PC의 크롬을 화면 없이 실행)
enabled = true
pages = 2                    # 검색 결과 몇 페이지까지 (1페이지 = 45개). 정렬이 안 돼서 2 이상 권장
min_interval = 5             # 검색 간격(초). 너무 줄이면 봇으로 차단될 수 있음
default_shipping = 800       # 배송비 별도 상품의 가정 배송비 (엔)
retries = 1
chrome_path = ""             # 비우면 자동으로 찾음 (크롬 → 엣지)

[sources.yahoo]
enabled = true
app_id = ""                  # → settings.local.toml 에 입력
endpoint = "https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch"
results = 30
cross_border_only = true     # 해외 구매대행 허용 상품만
default_shipping = 800
min_interval = 1.0           # 호출 간격(초)
retries = 2

[sources.manual]             # API 없는 쇼핑몰(타오바오·알리 등) 가격 직접 입력 → catalog/manual_prices.csv
enabled = true
file = "catalog/manual_prices.csv"
stale_days = 7               # 이 일수보다 오래 확인 안 한 가격은 '재확인' 알림

[sources.aliexpress]          # 알리 Open Platform 드롭쉬핑 상품 검색 aliexpress.ds.text.search (--market aliexpress 에서만 사용)
enabled = true               # 키 2개는 buyagent/.env 에: ALIEXPRESS_APP_KEY / ALIEXPRESS_APP_SECRET (제휴 API 는 이 앱에 권한 없음, 2026-11-24)
                             # 토큰은 data/aliexpress_token.json (data/get_token.py 로 발급, 매시간 감시가 자동 갱신)
endpoint = "https://api-sg.aliexpress.com/sync"   # 2026-11-24 실제 응답으로 확인
ship_to = "KR"
page_size = 40
default_shipping = 3         # 한국 배송비를 모를 때 가정 (USD). 상품 페이지에서 확인
min_interval = 1.0
retries = 2

[sources.ebay]                # 이베이 공식 Browse API (python main.py --search ... --market ebay 에서만 사용)
enabled = true               # 키 2개는 buyagent/.env 에: EBAY_CLIENT_ID (App ID) / EBAY_CLIENT_SECRET (Cert ID)
endpoint = "https://api.ebay.com/buy/browse/v1/item_summary/search"   # 키 받은 뒤 응답 1건으로 확인 (2026-11-18 미검증)
token_url = "https://api.ebay.com/identity/v1/oauth2/token"
limit = 50
forwarder_zip = ""           # 미국 배대지 우편번호 (예: 면세 주 델라웨어·오리건 창고). 넣으면 배대지까지 배송비를 이베이가 계산
default_shipping = 10        # 배대지까지 배송비를 모를 때 가정 (USD)
min_feedback = 98            # 판매자 평가(%)가 이보다 낮으면 경고
min_interval = 1.0
retries = 2

# ------------------------------------------------------------
#  원산지(발송 국가)별 설정 - 새 국가를 붙일 때 여기에 추가
# ------------------------------------------------------------
[origins.JP]
name = "일본"
duty_free_usd = 150          # 목록통관 면세 기준 (물품가격)

[origins.US]
name = "미국"
duty_free_usd = 200

[origins.CN]
name = "중국"
duty_free_usd = 150

[origins.CN_DIRECT]            # 알리처럼 판매자가 한국까지 직접 보내는 중국 상품 (배대지 안 거침)
name = "중국(직배송)"
duty_free_usd = 150

# 배대지 요금표 (원, 1회 배송 기준). 카테고리/상품이 small·medium·large 중 하나를 고름
[shipping_profiles.JP]
# 배대지·국제배송비는 무게(포장 포함)와 부피무게(가로×세로×높이cm÷6000) 중 큰 쪽으로 매김 (배대지마다 다름 → 실제 요금표 확인)
small = 8000                 # ~0.5kg, 얇고 작은 것: 아크릴·키링·노트·스티커 (라쿠텐 'メール便·ネコポス·ゆうパケット' 표시면 거의 여기)
medium = 15000               # ~2kg, 상자째 오는 것: 시계(상자 포함)·의류·두꺼운 다이어리
large = 25000                # 텀블러·가방 등 부피 큰 것

[shipping_checked]            # 배대지 요금표를 마지막으로 확인한 날 (YYYY-MM-DD). 비어 있으면 "확인 기록 없음" 경고
max_days = 30                # 이 날수가 지나면 화면·--check·디스코드로 "요금 확인할 때 됨" 알림
JP = ""                      # 위 small/medium/large 는 2026-11-16 추정값 → 배대지 정하면 화면 '배대지 요금'에서 저장

[shipping_hints.JP]            # 상품명·설명에 이 말이 있으면 '소형 배송일 수 있음' 알림 (계산값은 안 바꿈)
# 일본 우편함 배송: 두께 약 3cm·1kg 이하 (2026-11-19 기준, 운송사 규격은 바뀔 수 있음)
small_keywords = ["メール便", "M便", "ネコポス", "ゆうパケット", "クリックポスト", "定形外", "ポスト投函", "レターパック"]

[shipping_profiles.US]
small = 18000
medium = 28000
large = 45000

[shipping_profiles.CN]         # 중국 배대지(웨이하이·칭다오 등) 1건 요금 → 실제 이용할 배대지 요금표로 바꾸세요
small = 6000                 # 키캡·소품 (~1kg)
medium = 9000                # 키보드 텐키리스 (~2kg)
large = 14000                # 풀배열 키보드·데스크매트 (~3kg 이상)

[shipping_profiles.CN_DIRECT]  # 직배송 → 배대지 요금 없음 (한국까지 배송비는 상품 가격 옆 현지 배송비로 계산)
small = 0
medium = 0
large = 0

# ------------------------------------------------------------
[fx]
auto = true                  # frankfurter(ECB) 자동 조회
[fx.manual_krw]              # 자동 조회 실패 시 사용 (통화 1단위당 원화). 새 통화는 여기 추가
JPY = 9.4
USD = 1400.0
CNY = 195.0

[costs]
card_fx_fee_rate = 0.015
packaging_krw = 1000         # 개당
domestic_shipping_krw = 0    # 1회 배송당 (배대지 직배송이면 0)

[customs]
vat_rate = 0.10
include_duty_if_over = true

[pricing]                    # 카테고리에서 덮어쓸 수 있음
min_margin_krw = 20000
min_margin_rate = 0.10
round_to = 1000
price_ending = 900
max_price_multiple = 2.0

# ------------------------------------------------------------
#  네이버 검색어 트렌드 (NAVER API HUB) — python research.py
#  키 발급: 네이버 클라우드 플랫폼 콘솔 → NAVER API HUB → Application 등록 (검색어 트렌드)
#  키는 buyagent/.env 에만: NAVER_CLIENT_ID=… / NAVER_CLIENT_SECRET=… (코드·로그·커밋에 쓰지 않음)
#  ※ 네이버 쇼핑 검색 API(상품·가격)는 2026-07-31 종료, API HUB 에도 쇼핑 검색 없음 (2026-11-20 확인)
#    → 네이버 최저가는 화면 [네이버 최저가 보기] 링크로 보고 [최저가 적기]로 입력 (catalog/naver_prices.csv)
# ------------------------------------------------------------
[naver_low]
max_days = 30                # 적은 네이버 최저가가 이 날수보다 오래되면 화면에 '다시 확인 필요'

[alerts]
webhook_url = ""             # Slack 또는 Discord → settings.local.toml 에 입력
price_change_rate = 0.03

# ------------------------------------------------------------
#  판매 마켓 - 키 이름이 products.csv 의 my_price_<키> 열과 연결됨
#  새 마켓: 섹션 추가 + products.csv에 my_price_<키> 열 추가
# ------------------------------------------------------------
[markets.coupang]
name = "쿠팡"
fee_rate = 0.109             # 카테고리별 4~10.9%, VAT 별도 → Wing에서 확인
fee_vat_excluded = true

[markets.naver]
name = "스마트스토어"
fee_rate = 0.0603            # 결제 3.30% + 판매 2.73%, VAT 별도
fee_vat_excluded = true
