# ============================================================
#  사입(중국 → 한국, 재고 판매) 계산 설정 — python sourcing.py
#
#  ★ 아래 숫자는 예시값입니다. 실제로 이용할 구매대행·배대지·관세사 견적으로 바꾸세요.
#  환율·판매 마켓 수수료·기본 마진 기준은 settings.toml 것을 같이 씁니다.
# ============================================================

[purchase]
agent_fee_rate = 0.05        # 1688 구매대행 수수료 (상품가 대비)
card_fx_fee_rate = 0.015     # 해외결제·환전 수수료

# ------------------------------------------------------------
#  국제 배송 (중국 → 한국). 무게와 부피 중 큰 쪽으로 계산
#  같은 batch 끼리는 한 번에 보내서 최소요금·통관비를 나눠 냅니다.
# ------------------------------------------------------------
[freight]
method = "sea"               # sea(해운) 또는 air(항공). 실행할 때 --air 로 바꿔볼 수 있음

[freight.sea]
krw_per_kg = 2500            # kg당
krw_per_cbm = 150000         # 부피 1㎥(CBM)당
min_krw = 30000              # 1회 최소요금

[freight.air]
krw_per_kg = 7000
volumetric_divisor = 6000    # 부피무게(kg) = 가로×세로×높이(cm) ÷ 6000
min_krw = 15000

# ------------------------------------------------------------
#  통관 (사입은 정식 수입신고 → 면세 한도 없이 관세·부가세 부과)
#  관세율은 categories.toml 의 duty_rate. 한중 FTA 원산지증명서가 있으면 더 낮아질 수 있음
# ------------------------------------------------------------
[customs]
vat_rate = 0.10
broker_fee_krw = 33000       # 관세사 통관 수수료 (1회)
other_fees_krw = 0           # 창고료·검사비 등 (1회)

# ------------------------------------------------------------
#  판매
# ------------------------------------------------------------
[sale]
inbound_krw = 10000          # 배대지·항구 → 내 창고 국내 운송 (1회)
packaging_krw = 500          # 개당 포장재
outbound_shipping_krw = 3000 # 개당 고객 발송 택배비 (무료배송 기준. 배송비를 따로 받으면 0)

# ------------------------------------------------------------
#  부가세 처리 (사업자 유형) — 세무사 확인 권장
#   general : 일반과세자. 수입 부가세는 환급(매입세액공제) → 원가에서 빠짐, 판매가의 1/11은 납부
#   simple  : 간이과세자. 수입 부가세는 원가에 포함, 판매가 × simple_vat_rate_of_sales 만큼 납부
#   none    : 부가세 고려 안 함
# ------------------------------------------------------------
[tax]
type = "general"
simple_vat_rate_of_sales = 0.015   # 간이과세 소매업: 부가가치율 15% × 10%

# 마진 기준을 사입만 다르게 하려면 (비우면 settings.toml [pricing] + 카테고리 값)
[pricing]
