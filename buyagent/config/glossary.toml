# ============================================================
#  한글 → 일본어 단어장
#
#  categories.toml의 keywords / except 에 한글을 쓰면 여기서 찾아 일본어로 바꿔 줍니다.
#    except = ["특전포함"]   →   except = ["特典付き", "特典付", "特典あり"]
#
#  - 번역기가 아니라 고정된 단어장이라 결과가 항상 같습니다.
#  - 한 단어에 일본어 표현을 여러 개 넣으면 전부 적용됩니다 (그중 하나라도 있으면 일치).
#  - 띄어쓰기는 무시합니다. "특전 포함"과 "특전포함"은 같은 단어로 봅니다.
#  - 단어장에 없는 한글은 그대로 남고, 실행할 때 경고가 나옵니다 (일본어 상품명에는 걸리지 않으니까).
#  - 일본어 표현은 실제 상품명에서 복사해 넣는 게 가장 정확합니다.
#  - 전각/반각, 대소문자는 자동으로 같게 취급하니 한 번만 넣으면 됩니다.
# ============================================================

[words]

# ---- 오탐 방지용 (except 에 쓰기 좋은 것) ----
"특전포함"     = ["特典付き", "特典付", "特典あり"]
